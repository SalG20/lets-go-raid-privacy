<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Let's Go Raid — Security check</title>
  <link rel="stylesheet" href="style.css">
  <script src="../assets/flow-i18n.js" defer></script>
  <script src="challenge.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileReady" defer></script>
</head>
<body>
  <main>
    <h1>Let's Go Raid</h1>
    <p data-flow="secIntro">Complete the security check to continue creating your account.</p>
    <div id="challenge"></div>
    <p id="status" role="status" data-flow="secLoading">Loading security check…</p>
    <a id="continue" hidden data-flow="secReturn">Return to Let's Go Raid</a>
    <p data-flow="secNoData">No email address or password is sent to this page.</p>
  </main>
</body>
</html>
